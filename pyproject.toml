[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scd-shield-platform"
version = "0.1.0"
description = "NVIDIA SCD-SHIELD — Autonomous Supercomputer Cluster Diagnostics & Self-Healing Reliability Engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Aparna Patel" }
]

dependencies = [
    "langchain>=0.3,<2.0",
    "langchain-openai>=0.3,<2.0",
    "langchain-chroma>=0.2,<2.0",
    "chromadb>=0.6,<2.0",
    "pydantic>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "scipy>=1.14,<2.0",
    "matplotlib>=3.9,<4.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
    "hypothesis>=6.0,<7.0",
    "black>=25.0,<26.0",
    "ruff>=0.11,<1.0"
]

[tool.setuptools.packages.find]
include = ["shield*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".venv",
    "build",
    "dist",
    ".git"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"